<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffb3c6" />
  <title>Thiệp 20.10 💐</title>
  <meta name="description" content="Một tấm thiệp nhỏ dành tặng bạn nhân ngày Phụ nữ Việt Nam 20/10" />
  <meta property="og:title" content="Bạn có một tấm thiệp 20.10 💌" />
  <meta property="og:description" content="Chạm để mở thiệp nhé!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- SVG dùng chung: hoa hồng nhung + gradient -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="velvet" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="44">
        <stop offset="0" stop-color="#4a000e" />
        <stop offset="0.45" stop-color="#9d0b2e" />
        <stop offset="0.82" stop-color="#d1234f" />
        <stop offset="1" stop-color="#ff7a99" />
      </radialGradient>
      <radialGradient id="bud" gradientUnits="userSpaceOnUse" cx="48" cy="46" r="16">
        <stop offset="0" stop-color="#e0315c" />
        <stop offset="1" stop-color="#5c0015" />
      </radialGradient>
      <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6fbf5f" />
        <stop offset="1" stop-color="#2f6b2a" />
      </linearGradient>
      <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff0f4" />
        <stop offset="1" stop-color="#ffc2d4" />
      </linearGradient>

      <symbol id="rose" viewBox="0 0 100 100">
        <g stroke="#ff9db3" stroke-opacity=".35" stroke-width=".8">
          <!-- lớp cánh ngoài -->
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" />
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(72 50 50)" />
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(144 50 50)" />
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(216 50 50)" />
          <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(288 50 50)" />
          <!-- lớp cánh giữa -->
          <g transform="translate(50 50) scale(.7) translate(-50 -50)">
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(36 50 50)" />
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(108 50 50)" />
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(180 50 50)" />
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(252 50 50)" />
            <path d="M50 50 C28 44 24 14 50 8 C76 14 72 44 50 50Z" fill="url(#velvet)" transform="rotate(324 50 50)" />
          </g>
        </g>
        <!-- nụ giữa -->
        <circle cx="50" cy="50" r="15" fill="url(#bud)" />
        <path d="M50 38 C61 38 64 51 54 56 C44 61 37 51 44 45 C49 41 55 46 51 51"
              fill="none" stroke="#3d000b" stroke-width="1.6" stroke-linecap="round" opacity=".75" />
        <path d="M40 42 C44 36 52 35 57 38" fill="none" stroke="#ff8fab" stroke-width="1" opacity=".5" stroke-linecap="round" />
      </symbol>

      <linearGradient id="wingG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd1dc" />
        <stop offset="1" stop-color="#ff4d8d" />
      </linearGradient>
      <radialGradient id="budG" cx=".4" cy=".35" r=".7">
        <stop offset="0" stop-color="#ffc2d4" />
        <stop offset="1" stop-color="#e75480" />
      </radialGradient>

      <!-- Cụm hoa trang trí góc thiệp -->
      <symbol id="bloom" viewBox="0 0 130 130">
        <g fill="url(#leaf)">
          <path d="M0 0 C12 -11 32 -11 48 0 C32 11 12 11 0 0Z" transform="translate(65 65) rotate(-15)" />
          <path d="M0 0 C12 -11 32 -11 48 0 C32 11 12 11 0 0Z" transform="translate(65 65) rotate(55)" />
          <path d="M0 0 C12 -11 32 -11 48 0 C32 11 12 11 0 0Z" transform="translate(65 65) rotate(135)" />
          <path d="M0 0 C12 -11 32 -11 48 0 C32 11 12 11 0 0Z" transform="translate(65 65) rotate(195)" />
          <path d="M0 0 C12 -11 32 -11 48 0 C32 11 12 11 0 0Z" transform="translate(65 65) rotate(260)" />
        </g>
        <g stroke="#2f6b2a" stroke-width=".8" opacity=".45">
          <path d="M0 0 L46 0" transform="translate(65 65) rotate(-15)" />
          <path d="M0 0 L46 0" transform="translate(65 65) rotate(55)" />
          <path d="M0 0 L46 0" transform="translate(65 65) rotate(135)" />
          <path d="M0 0 L46 0" transform="translate(65 65) rotate(195)" />
          <path d="M0 0 L46 0" transform="translate(65 65) rotate(260)" />
        </g>
        <!-- nụ hồng -->
        <g>
          <ellipse cx="0" cy="-7" rx="5" ry="8" fill="url(#budG)" transform="translate(112 52) rotate(70)" />
          <path d="M-5 -2 Q0 4 5 -2 L3 2 Q0 6 -3 2Z" fill="#3f7a3a" transform="translate(112 52) rotate(70)" />
          <ellipse cx="0" cy="-7" rx="4.5" ry="7" fill="url(#budG)" transform="translate(40 112) rotate(200)" />
          <path d="M-5 -2 Q0 4 5 -2 L3 2 Q0 6 -3 2Z" fill="#3f7a3a" transform="translate(40 112) rotate(200)" />
        </g>
        <!-- hoa baby trắng -->
        <g fill="#fff" stroke="#ffc2d4" stroke-width=".6">
          <circle cx="20" cy="40" r="2.6" /><circle cx="14" cy="47" r="2" /><circle cx="24" cy="50" r="2.2" />
          <circle cx="98" cy="104" r="2.6" /><circle cx="106" cy="98" r="2" /><circle cx="104" cy="110" r="2.2" />
          <circle cx="60" cy="10" r="2.4" /><circle cx="68" cy="14" r="1.8" />
          <circle cx="118" cy="78" r="2" /><circle cx="10" cy="82" r="2" />
        </g>
        <use href="#rose" x="18" y="70" width="40" height="40" />
        <use href="#rose" x="74" y="20" width="38" height="38" />
        <use href="#rose" x="33" y="33" width="64" height="64" />
      </symbol>
    </defs>
  </svg>

  <div class="bokeh" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="burst" id="burst" aria-hidden="true"></div>

  <main class="stage">
    <div class="card-wrap" id="cardWrap">
      <div class="card" id="card">

        <!-- Bên trong thiệp -->
        <section class="inside">
          <div class="inside-scroll" id="insideScroll">
            <div class="header">
              <div class="avatar" id="avatar" hidden>
                <img id="avatarImg" alt="" />
                <span class="avatar-badge" aria-hidden="true">🌸</span>
              </div>
              <h2 class="title" id="title"></h2>
            </div>
            <p class="message" id="message"></p>
            <p class="signature" id="signature"></p>
          </div>
          <button class="replay" id="replayBtn" type="button" aria-label="Xem lại" title="Xem lại">↺</button>
        </section>

        <!-- Bìa thiệp -->
        <section class="cover" id="cover" role="button" tabindex="0" aria-label="Mở thiệp">
          <div class="cover-face cover-front">
            <div class="cover-frame">
              <p class="cover-top" id="coverTop"></p>
              <h1 class="cover-big" id="coverBig"></h1>

              <svg class="bouquet" viewBox="0 0 200 230" aria-hidden="true">
                <g stroke="#3f7a3a" stroke-width="3" fill="none" stroke-linecap="round">
                  <path d="M100 205 C98 165 72 125 58 82" />
                  <path d="M100 205 C100 155 100 110 100 60" />
                  <path d="M100 205 C102 165 128 125 142 82" />
                </g>
                <g fill="url(#leaf)">
                  <path d="M76 132 C58 120 46 128 40 140 C58 145 70 142 76 132Z" />
                  <path d="M124 132 C142 120 154 128 160 140 C142 145 130 142 124 132Z" />
                  <path d="M100 124 C86 108 90 96 100 90 C110 96 114 108 100 124Z" />
                </g>
                <path d="M56 148 L100 226 L144 148 Q100 168 56 148Z" fill="url(#wrap)" stroke="#ffb3c6" stroke-width="1.5" />
                <path d="M100 182 C84 168 74 178 84 186 Z M100 182 C116 168 126 178 116 186 Z" fill="#e75480" />
                <circle cx="100" cy="182" r="5" fill="#c9184a" />
                <path d="M98 186 L90 204 M102 186 L110 204" stroke="#e75480" stroke-width="3" stroke-linecap="round" />
                <use href="#rose" x="26" y="50" width="64" height="64" />
                <use href="#rose" x="110" y="50" width="64" height="64" />
                <use href="#rose" x="64" y="20" width="72" height="72" />
              </svg>

              <p class="cover-sub" id="coverSub"></p>
            </div>
            <span class="shine" aria-hidden="true"></span>
          </div>
          <div class="cover-face cover-back"></div>
        </section>

      </div>

      <!-- Trang trí viền ngoài thiệp -->
      <div class="deco" aria-hidden="true">
        <svg class="bloom bloom-tr"><use href="#bloom" /></svg>
        <svg class="bloom bloom-bl"><use href="#bloom" /></svg>
        <svg class="butterfly" viewBox="0 0 60 50">
          <g class="wing">
            <path d="M30 24 C22 2 0 0 4 18 C6 26 20 28 30 24Z" fill="url(#wingG)" />
            <path d="M30 27 C24 34 10 44 12 34 C14 28 24 26 30 27Z" fill="url(#wingG)" />
            <circle cx="14" cy="14" r="2.2" fill="#fff" opacity=".8" /><circle cx="18" cy="33" r="1.6" fill="#fff" opacity=".8" />
          </g>
          <g class="wing wing-r">
            <path d="M30 24 C38 2 60 0 56 18 C54 26 40 28 30 24Z" fill="url(#wingG)" />
            <path d="M30 27 C36 34 50 44 48 34 C46 28 36 26 30 27Z" fill="url(#wingG)" />
            <circle cx="46" cy="14" r="2.2" fill="#fff" opacity=".8" /><circle cx="42" cy="33" r="1.6" fill="#fff" opacity=".8" />
          </g>
          <ellipse cx="30" cy="26" rx="2" ry="9" fill="#6a040f" />
          <path d="M29 18 C27 12 24 9 22 8 M31 18 C33 12 36 9 38 8" stroke="#6a040f" stroke-width="1" fill="none" stroke-linecap="round" />
        </svg>
        <span class="spark sp1">✦</span>
        <span class="spark sp2">✦</span>
        <span class="spark sp3">✦</span>
        <span class="spark sp4">✦</span>
        <span class="spark sp5">✦</span>
      </div>
    </div>

    <button class="open-btn" id="openBtn" type="button"></button>

    <!-- Câu hỏi nhỏ dưới thiệp -->
    <button class="quiz-open" id="quizOpen" type="button">
      <span class="quiz-open-q" id="quizOpenQ"></span>
      <span class="quiz-open-cta" id="quizOpenCta"></span>
    </button>
  </main>

  <!-- Popup nhập câu trả lời (nằm phía trên để bàn phím không che) -->
  <div class="ask" id="ask" hidden>
    <form class="quiz" id="quiz" autocomplete="off">
      <button class="ask-close" id="askClose" type="button" aria-label="Đóng">×</button>
      <p class="quiz-q" id="quizQ"></p>
      <div class="quiz-row">
        <input class="quiz-input" id="quizInput" type="text" enterkeyhint="send" />
        <button class="quiz-btn" id="quizBtn" type="submit"></button>
      </div>
      <p class="quiz-count" id="quizCount" aria-live="polite"></p>
    </form>
  </div>

  <!-- Chữ "Sai" to dần -->
  <div class="wrong-pop" id="wrongPop" aria-live="assertive"></div>

  <!-- Popup trả lời đúng -->
  <div class="win" id="win" hidden>
    <div class="win-box" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <img class="win-photo" id="winPhoto" alt="" />
      <h3 class="win-title" id="winTitle"></h3>
      <p class="win-text" id="winText"></p>
      <button class="win-close" id="winClose" type="button"></button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
